name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-groups --locked

      - name: requirements.txt matches uv.lock
        if: runner.os == 'Linux'
        run: |
          uv export --no-hashes --no-dev --no-header -q -o /tmp/req.txt
          diff /tmp/req.txt requirements.txt

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
