[project]
name = "or-solver-streamlit"
version = "2.1.0"
description = "Linear and integer programming solver for teaching, with textbook syntax"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Vitor Pinheiro" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["operations-research", "linear-programming", "optimization", "education", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "ortools>=9.10",
    "pandas>=2.2",
    "plotly>=5.20",
    "pydantic>=2.7",
    "pyparsing>=3.1",
    "pyyaml>=6.0",
    "streamlit[pdf]>=1.50",
]

[project.urls]
Homepage = "https://github.com/jvitorcosta/or-solver-streamlit"
Repository = "https://github.com/jvitorcosta/or-solver-streamlit"
Issues = "https://github.com/jvitorcosta/or-solver-streamlit/issues"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "solvedor"  # import name differs from the distribution name

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "types-pyyaml>=6.0.12.20260906",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "N",        # pep8-naming
    "PTH",      # use pathlib
    "S",        # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ortools.*", "plotly.*"]  # no type stubs published
ignore_missing_imports = true

# TEMPORARY: modules rewritten by later refactor tasks (parser: Task 2, backends: Task 4,
# engine: Task 5, tests: Task 10). Each task removes its entry; none may remain at the end.
[[tool.mypy.overrides]]
module = ["solvedor.solver.engine", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["solvedor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 55  # TEMPORARY: raised to 80 in Task 10 (AppTest covers the UI)
